name: Build VST3 Plugin

on:
  push:
    branches:
      - claude/vst-torso-s4-plugin-K3n6R
      - claude/remove-vst-plugin-piggK
  pull_request:
    branches:
      - claude/vst-torso-s4-plugin-K3n6R
      - claude/remove-vst-plugin-piggK
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install CMake
      run: |
        brew install cmake

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build VST3
      run: |
        cd build
        cmake --build . --config Release -j4 --verbose

    - name: List build artifacts
      run: |
        echo "=== Searching for VST3 files ==="
        find . -name "*.vst3" -type d -o -name "*.vst3" -type f
        echo ""
        echo "=== Searching for any TorsoS4 files ==="
        find . -name "*TorsoS4*"
        echo ""
        echo "=== Build directory contents ==="
        ls -la build/ || true
        echo ""
        echo "=== Looking for artefacts directory ==="
        find build -type d -name "*artefact*" -o -type d -name "*artifact*" || true

    - name: Package VST3
      run: |
        # Find the VST3 plugin (search entire workspace, account for spaces in filename)
        VST3_PATH=$(find . -name "*.vst3" -type d -path "*/VST3/*" | head -n 1)
        if [ -z "$VST3_PATH" ]; then
          echo "Error: VST3 plugin not found!"
          echo "Searching for any .vst3 files:"
          find . -name "*.vst3"
          echo "All files in build directory:"
          find build -type f | head -50
          exit 1
        fi
        echo "Found VST3 at: $VST3_PATH"

        # Package it
        cd $(dirname "$VST3_PATH")
        zip -r TorsoS4-macOS.zip "$(basename "$VST3_PATH")"
        mv TorsoS4-macOS.zip $GITHUB_WORKSPACE/

        echo "VST3 packaged successfully!"
        ls -lh $GITHUB_WORKSPACE/TorsoS4-macOS.zip

    - name: Upload VST3 artifact
      uses: actions/upload-artifact@v4
      with:
        name: TorsoS4-VST3-macOS
        path: TorsoS4-macOS.zip
        retention-days: 30

    - name: Build info
      run: |
        echo "✅ VST3 plugin built successfully for macOS!"
        echo "📦 Download the artifact from the Actions tab above"
        echo "📍 Install to: ~/Library/Audio/Plug-Ins/VST3/"
